name: Links

on:
  pull_request:
    paths: [README.md, lychee.toml]
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml README.md CONTRIBUTING.md
          # Pull requests fail on a broken link; the weekly run opens an issue instead.
          fail: ${{ github.event_name == 'pull_request' }}

      - name: Open an issue for broken links
        if: steps.lychee.outputs.exit_code != 0 && github.event_name != 'pull_request'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links found
          content-filepath: ./lychee/out.md
          labels: broken-link
